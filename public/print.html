<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print — Gessosheet</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      The print window — Phase 39.

      The spreadsheet is a canvas, and a canvas prints as a picture of
      the screen. This page is the table instead: the application worker
      builds it (src/app/SheetPrint.ts) and sends it here on the
      `gessosheet-print` BroadcastChannel, and the browser does the rest
      — page breaks, margins, and Save as PDF in its own dialog.

      Plain DOM and no build step, on purpose: it is a page for a
      printer, and everything it shows came from the sheet already
      escaped.
    -->
    <style>
      :root {
        color-scheme: light;
        --ink: #111827;
        --muted: #6b7280;
        --rule: #d1d5db;
        --bar: #f3f4f6;
      }
      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .bar {
        position: sticky;
        top: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        background: var(--bar);
        border-bottom: 1px solid var(--rule);
      }
      .bar h1 {
        font-size: 15px;
        margin: 0 8px 0 0;
      }
      .bar .hint {
        color: var(--muted);
        flex: 1 1 240px;
      }
      .bar button {
        font: inherit;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--rule);
        background: #fff;
        cursor: pointer;
      }
      .bar button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      main {
        padding: 16px;
        overflow-x: auto;
      }
      table.sheet {
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 12px;
      }
      table.sheet td {
        padding: 2px 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
        vertical-align: bottom;
        height: 20px;
      }
      body.grid table.sheet td {
        outline: 1px solid #e5e7eb;
        outline-offset: -1px;
      }
      .empty,
      .waiting {
        color: var(--muted);
      }
      @media print {
        .bar {
          display: none;
        }
        main {
          padding: 0;
          overflow: visible;
        }
        td {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>
    <style id="page">
      @page {
        size: portrait;
        margin: 12mm;
      }
    </style>
  </head>
  <body class="grid">
    <div class="bar">
      <h1 id="title">Print</h1>
      <button class="primary" id="print" type="button">Print</button>
      <label><input type="checkbox" id="gridlines" checked /> Gridlines</label>
      <label><input type="checkbox" id="landscape" /> Landscape</label>
      <span class="hint" id="hint">To save a PDF, choose Save as PDF as the printer.</span>
      <button id="close" type="button">Close</button>
    </div>
    <main id="sheet"><p class="waiting">Waiting for the sheet…</p></main>
    <script>
      const channel = new BroadcastChannel('gessosheet-print');
      let drawn = 0;
      channel.onmessage = event => {
        const job = event.data;
        if (job === null || typeof job !== 'object' || typeof job.id !== 'number' || job.id === drawn) {
          return;
        }
        drawn = job.id;
        document.title = job.title;
        document.getElementById('title').textContent = job.title;
        document.getElementById('sheet').innerHTML = job.html;
        document.getElementById('hint').textContent = job.pdf
          ? 'In the dialog, choose Save as PDF as the destination.'
          : 'To save a PDF, choose Save as PDF as the printer.';
        // The dialog opens by itself, as Print does everywhere; the bar
        // stays for changing the layout and printing again.
        setTimeout(() => window.print(), 250);
      };
      channel.postMessage({ ready: true });
      document.getElementById('print').onclick = () => window.print();
      document.getElementById('close').onclick = () => window.close();
      document.getElementById('gridlines').onchange = event => document.body.classList.toggle('grid', event.target.checked);
      document.getElementById('landscape').onchange = event => {
        document.getElementById('page').textContent = `@page { size: ${event.target.checked ? 'landscape' : 'portrait'}; margin: 12mm; }`;
      };
    </script>
  </body>
</html>
