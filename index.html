<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gessosheet</title>
    <style>
      /*
        The canvas is sized to its host, so the host needs a size. This
        is the whole of the CSS the application needs; everything below
        the strip is painted, not styled.

        The strip is the exception, and deliberately so: it is ordinary
        DOM on the main thread, which is what makes it able to prove
        anything. When it freezes and the sheet does not, the two are
        visibly not the same thread.
      */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        font: 12px/1.4 system-ui, sans-serif;
        background: #f6f6f7;
      }
      #app {
        flex: 1;
        min-height: 0;
      }
      #proof {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 6px 10px;
        background: #22242a;
        color: #d7d9e0;
        border-bottom: 1px solid #000;
      }
      #proof button {
        font: inherit;
        padding: 4px 9px;
        border-radius: 5px;
        border: 1px solid #4a4d57;
        background: #32353e;
        color: #e8eaf0;
        cursor: pointer;
      }
      #proof button:hover {
        background: #3d414c;
      }
      #proof label {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      #proof .stat {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #proof .stat b {
        color: #fff;
        font-weight: 600;
      }
      #proof .sep {
        width: 1px;
        align-self: stretch;
        background: #4a4d57;
      }
      /*
        The one animation on the page, and the only honest way to show
        a thread is alive: it is driven by the main thread's own
        requestAnimationFrame, so it stops dead the moment that thread
        is busy — while the sheet, which is not on it, keeps scrolling.
      */
      #pulse {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #5ec26a;
      }
      #pulse.blocked {
        background: #d4564f;
      }
      /*
        Floated over the sheet rather than placed above it. In the flow
        it was a block whose height changed with whatever was being
        explained, so the grid slid up and down under the pointer while
        somebody read about it — and every slide resized the canvas,
        which re-laid out the scene and made the heatmap a picture of
        the explanation rather than of the sheet. It also ignores the
        pointer, so the cell underneath stays hoverable.
      */
      #explain {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 1;
        margin: 0;
        padding: 9px 11px;
        max-width: min(680px, calc(100vw - 24px));
        max-height: 42vh;
        overflow: auto;
        pointer-events: none;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        background: #16171bf2;
        color: #b9bdc7;
        border: 1px solid #3a3d46;
        border-radius: 6px;
        box-shadow: 0 6px 24px #0006;
      }
      #explain[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="proof">
      <span id="pulse" title="The main thread's own animation frame"></span>
      <button id="block" type="button">Block the main thread for 5s</button>
      <label><input id="heatmap" type="checkbox" />Layout heatmap</label>
      <span class="sep"></span>
      <span class="stat">render worker <b id="fps">—</b> fps</span>
      <span class="stat">worst frame gap <b id="gap">—</b></span>
      <span class="stat">re-measured <b id="measured">—</b> last frame, at most <b id="peak">—</b></span>
      <span class="stat">main thread <b id="mainfps">—</b> fps</span>
    </div>
    <pre id="explain" hidden></pre>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
