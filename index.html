<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gessosheet</title>
    <style>
      /*
        The canvas is sized to its host, so the host needs a size. That
        is the whole of the CSS this page has, and on `/` it is the
        whole of the CSS the application has: everything below is
        painted, not styled.

        `/proof` adds the strip along the top, and it brings its own
        styles with it — see `ProofPanel`. It is built rather than
        written out here because a page that is not the proof route
        should not carry the markup for it, unstyled for a frame and
        then removed. The column layout is left in place for it to
        arrive into.
      */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        font: 12px/1.4 system-ui, sans-serif;
        background: #f6f6f7;
      }
      #app {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
